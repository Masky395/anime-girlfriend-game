<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitsune Love Quest</title>
  <style>
    :root {
      --bg1: #140d2a;
      --bg2: #251243;
      --panel: rgba(24, 18, 41, 0.88);
      --panel2: rgba(42, 28, 68, 0.9);
      --pink: #ff7ad9;
      --rose: #ff4db8;
      --cyan: #7fe7ff;
      --gold: #ffd76a;
      --white: #f7f0ff;
      --muted: #d5c6ef;
      --good: #7ef7b2;
      --bad: #ff8d8d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at top, rgba(255, 140, 213, 0.18), transparent 25%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--white);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: min(1000px, 100%);
      background: rgba(17, 12, 28, 0.9);
      border: 2px solid rgba(255, 122, 217, 0.3);
      border-radius: 28px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 60px rgba(255, 122, 217, 0.2);
      overflow: hidden;
    }

    .screen {
      display: none;
      min-height: 800px;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
    }

    /* ===== TITLE SCREEN ===== */
    .title-screen {
      background:
        linear-gradient(180deg, rgba(255, 120, 190, 0.2), rgba(0,0,0,0.3)),
        linear-gradient(135deg, #180e2e, #2d1747);
      padding: 40px 30px;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .title-wrap {
      max-width: 700px;
    }

    h1 {
      font-size: clamp(2.8rem, 6vw, 5.5rem);
      margin: 0 0 12px;
      line-height: 1;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #ffe0fb, #ff6ab0, #7fe7ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 8px 20px rgba(255, 100, 180, 0.2));
    }

    .subtitle {
      color: var(--muted);
      font-size: 1.15rem;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .title-card {
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255, 122, 217, 0.25);
      border-radius: 20px;
      padding: 28px 24px;
      margin-top: 24px;
      backdrop-filter: blur(10px);
    }

    input[type="text"] {
      width: 100%;
      max-width: 360px;
      padding: 14px 18px;
      border-radius: 12px;
      border: 2px solid rgba(255, 122, 217, 0.3);
      background: rgba(10, 7, 18, 0.8);
      color: var(--white);
      font-size: 1.05rem;
      outline: none;
      margin-bottom: 18px;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      border-color: #ff7ad9;
      box-shadow: 0 0 15px rgba(255, 122, 217, 0.3);
    }

    .button-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 13px 26px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #1c0f2d;
      background: linear-gradient(135deg, var(--pink), #ffd1f1);
      box-shadow: 0 4px 15px rgba(255, 122, 217, 0.3);
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 122, 217, 0.4);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    button.secondary {
      background: linear-gradient(135deg, #7fe7ff, #a7d8ff);
      color: #0a1f32;
    }

    button.ghost {
      background: rgba(255,255,255,0.08);
      color: var(--white);
      border: 2px solid rgba(255,255,255,0.15);
      box-shadow: none;
      padding: 10px 16px;
      font-size: 0.9rem;
    }

    button.ghost:hover:not(:disabled) {
      background: rgba(255,255,255,0.12);
      box-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    /* ===== GAME SCREEN ===== */
    .game-screen {
      background:
        linear-gradient(180deg, rgba(22, 14, 32, 0.85), rgba(12, 8, 24, 0.95)),
        linear-gradient(135deg, rgba(255, 130, 194, 0.1), rgba(127, 231, 255, 0.08));
      flex-direction: column;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      background: rgba(255,255,255,0.02);
      border-bottom: 2px solid rgba(255, 122, 217, 0.15);
      flex-wrap: wrap;
    }

    .topbar .status {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 122, 217, 0.1);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.95rem;
      border: 1px solid rgba(255, 122, 217, 0.25);
      font-weight: 600;
    }

    .pill strong {
      color: var(--gold);
    }

    .scene {
      display: grid;
      grid-template-columns: 300px 1fr;
      flex: 1;
      gap: 0;
    }

    .portrait-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, rgba(255, 122, 217, 0.08), rgba(127, 231, 255, 0.05));
      border-right: 2px solid rgba(255, 122, 217, 0.15);
      padding: 28px 20px;
    }

    .avatar-container {
      position: relative;
      width: 220px;
      height: 220px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 120px;
      background: radial-gradient(circle at 30% 30%, #ffd3ef, #d58dff 40%, #7b6cff 100%);
      box-shadow: 0 0 40px rgba(255, 122, 217, 0.6), inset 0 -10px 30px rgba(0, 0, 0, 0.2);
      border: 5px solid rgba(255,255,255,0.25);
      position: relative;
      overflow: hidden;
    }

    .avatar::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.3), transparent 50%);
      pointer-events: none;
    }

    .girlfriend-name {
      font-size: 2.2rem;
      font-weight: 800;
      margin: 0 0 12px;
      color: #ffe2f8;
      letter-spacing: 1px;
    }

    .mood-title {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .mood-bar {
      width: 100%;
      height: 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      margin-top: 8px;
      border: 1px solid rgba(255, 122, 217, 0.2);
    }

    .mood-fill {
      display: block;
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, var(--good), var(--cyan));
      border-radius: inherit;
      transition: width 0.4s ease;
      box-shadow: 0 0 10px var(--cyan);
    }

    /* ===== DIALOGUE PANEL ===== */
    .dialogue-panel {
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .scene-label {
      font-size: 0.85rem;
      color: var(--cyan);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 12px;
      font-weight: 800;
    }

    .dialogue {
      font-size: clamp(1.05rem, 1.6vw, 1.45rem);
      line-height: 1.8;
      color: var(--white);
      min-height: 160px;
      background: rgba(255,255,255,0.04);
      border: 2px solid rgba(255, 122, 217, 0.2);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(5px);
    }

    .choice-list {
      display: grid;
      gap: 12px;
      margin-top: 8px;
    }

    .choice {
      text-align: left;
      width: 100%;
      padding: 16px 18px;
      border-radius: 14px;
      background: rgba(255, 122, 217, 0.08);
      border: 2px solid rgba(255, 122, 217, 0.2);
      color: var(--white);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .choice:hover {
      background: rgba(255, 122, 217, 0.15);
      border-color: rgba(255, 122, 217, 0.5);
      transform: translateX(4px);
      box-shadow: 0 0 15px rgba(255, 122, 217, 0.2);
    }

    .choice:active {
      transform: translateX(2px);
    }

    .control-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    /* ===== ENDING SCREEN ===== */
    .ending-screen {
      background:
        linear-gradient(180deg, rgba(18, 8, 30, 0.95), rgba(11, 9, 20, 0.98)),
        linear-gradient(135deg, rgba(255, 112, 182, 0.15), rgba(127, 231, 255, 0.1));
      padding: 40px 30px;
      align-items: center;
      justify-content: center;
    }

    .ending-card {
      max-width: 700px;
      text-align: center;
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255, 122, 217, 0.3);
      border-radius: 24px;
      padding: 36px 28px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .ending-card h2 {
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      margin: 0 0 16px;
      background: linear-gradient(90deg, #ffeaca, #ff8cc8, #7fe7ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 2px;
    }

    .ending-card p {
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.9;
      margin-bottom: 24px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 900px) {
      .scene {
        grid-template-columns: 1fr;
      }

      .portrait-panel {
        border-right: none;
        border-bottom: 2px solid rgba(255, 122, 217, 0.15);
        padding: 24px 20px;
      }

      .avatar-container {
        width: 180px;
        height: 180px;
      }

      .avatar {
        font-size: 90px;
      }

      .girlfriend-name {
        font-size: 1.8rem;
      }
    }

    @media (max-width: 600px) {
      .topbar {
        gap: 8px;
      }

      .pill {
        padding: 6px 10px;
        font-size: 0.85rem;
      }

      .dialogue-panel {
        padding: 20px 16px;
      }

      .dialogue {
        min-height: 120px;
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- TITLE SCREEN -->
    <div id="titleScreen" class="screen title-screen active">
      <div class="title-wrap">
        <h1>🦊 Kitsune Love 🦊</h1>
        <div class="subtitle">An enchanting visual novel about love with a mysterious fox girl. Make choices that matter.</div>

        <div class="title-card">
          <input id="playerName" type="text" maxlength="20" value="Player" placeholder="Enter your name..." />
          <div class="button-row">
            <button id="startBtn">✨ Start Game ✨</button>
          </div>
        </div>
      </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen" class="screen game-screen">
      <div class="topbar">
        <div class="status">
          <div class="pill">📅 Day <strong id="dayValue">1</strong></div>
          <div class="pill">💗 Affection <strong id="loveValue">0</strong></div>
          <div class="pill">⚡ Energy <strong id="energyValue">60</strong></div>
          <div class="pill">😊 Mood <strong id="moodValue">50</strong></div>
          <div class="pill">💰 Coins <strong id="coinsValue">10</strong></div>
        </div>
        <div class="button-row" style="justify-content: flex-end;">
          <button class="secondary" id="saveBtn">💾 Save</button>
          <button class="ghost" id="loadBtn">📂 Load</button>
          <button class="ghost" id="resetBtn">🔄 Reset</button>
        </div>
      </div>

      <div class="scene">
        <div class="portrait-panel">
          <div class="avatar-container">
            <div class="avatar">🦊</div>
          </div>
          <h2 id="girlfriendName" class="girlfriend-name">Akira</h2>
          <div class="mood-title">Mood</div>
          <div class="mood-bar">
            <span id="moodBar" class="mood-fill"></span>
          </div>
        </div>

        <div class="dialogue-panel">
          <div>
            <div class="scene-label" id="sceneLabel">Scene</div>
            <div id="dialogue" class="dialogue"></div>
          </div>

          <div id="choices" class="choice-list"></div>

          <div class="control-row">
            <button class="secondary" id="nextBtn" style="display: none;">Continue →</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ENDING SCREEN -->
    <div id="endingScreen" class="screen ending-screen">
      <div class="ending-card">
        <h2 id="endingTitle">Ending</h2>
        <p id="endingText"></p>
        <div class="button-row">
          <button id="playAgainBtn">🔁 Play Again</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "kitsune_love_save_v2";

    const state = {
      playerName: "Player",
      girlfriendName: "Akira",
      affection: 0,
      mood: 50,
      energy: 60,
      coins: 10,
      day: 1,
      currentScene: "intro",
      ending: null,
      history: []
    };

    const scenes = {
      intro: {
        label: "Moonlit Forest Meeting",
        text: "You wander through the ancient forest on a misty night. Suddenly, you see a figure with fox ears and a fluffy tail sitting beneath a cherry tree, glowing softly in the moonlight. She looks at you with curious golden eyes. 'Hm? A human wandering here at night?'",
        choices: [
          { text: "Approach her calmly and introduce yourself.", next: "meet1", affection: 3, mood: 4, energy: -2, coins: 0 },
          { text: "Ask if she's lost or lonely.", next: "meet2", affection: 2, mood: 3, energy: 0, coins: 0 },
          { text: "Nervously compliment her beauty.", next: "meet3", affection: 2, mood: -1, energy: -2, coins: 0 }
        ]
      },

      meet1: {
        label: "First Words",
        text: "Akira tilts her head, her ears twitching. 'Well, aren't you polite? Most humans run away when they see a fox like me.' She smiles, revealing just a hint of mischief. 'I'm Akira. And you are?'",
        choices: [
          { text: "Tell her your name warmly.", next: "walk", affection: 4, mood: 5, energy: -2, coins: 0 },
          { text: "Ask her about herself and the forest.", next: "forest", affection: 5, mood: 6, energy: -1, coins: 0 },
          { text: "Compliment her ethereal presence.", next: "flattery", affection: 3, mood: 4, energy: -1, coins: 0 }
        ]
      },

      meet2: {
        label: "Showing Concern",
        text: "Akira laughs, a sound like silver bells. 'Lonely? Maybe a little. Humans rarely come to this deep part of the forest. But I'm never truly alone.' She pats the spot next to her. 'Want to sit with me?'",
        choices: [
          { text: "Sit beside her without hesitation.", next: "sit", affection: 5, mood: 7, energy: -2, coins: 0 },
          { text: "Ask what she does here all the time.", next: "forest", affection: 4, mood: 5, energy: -1, coins: 0 },
          { text: "Carefully sit down, keeping distance.", next: "walk", affection: 2, mood: 3, energy: -1, coins: 0 }
        ]
      },

      meet3: {
        label: "Nervous Charm",
        text: "Akira blushes and looks away, her tail curling around her. 'Oh... you're kind to say that. Most humans see me and only fear.' She glances back at you with softer eyes. 'You're different though. I like that.'",
        choices: [
          { text: "Be honest about your feelings.", next: "flattery", affection: 4, mood: 5, energy: -1, coins: 0 },
          { text: "Ask her name and about her life.", next: "forest", affection: 3, mood: 4, energy: -1, coins: 0 },
          { text: "Offer your hand and smile.", next: "sit", affection: 5, mood: 6, energy: -2, coins: 0 }
        ]
      },

      walk: {
        label: "Forest Walk",
        text: "You walk through the moonlit forest together. Akira tells you ancient stories of her kind, of magic and wonder hidden from human eyes. She seems to trust you with secrets. 'Most humans would never believe me,' she admits softly.",
        choices: [
          { text: "Tell her you believe everything she says.", next: "shrine", affection: 6, mood: 7, energy: -2, coins: 0 },
          { text: "Ask her about her magical abilities.", next: "magic", affection: 5, mood: 6, energy: -2, coins: 0 },
          { text: "Share your own story and dreams.", next: "confession", affection: 4, mood: 5, energy: -2, coins: 0 }
        ]
      },

      sit: {
        label: "Beneath the Cherry Tree",
        text: "You sit beside Akira under the blooming cherry tree. The petals fall like snow around you both. She rests her head on your shoulder, and you feel the warmth of her presence. 'This is nice,' she whispers. 'I haven't felt this peaceful in so long.'",
        choices: [
          { text: "Gently place your arm around her.", next: "confession", affection: 7, mood: 8, energy: -2, coins: 0 },
          { text: "Tell her you'd stay with her always.", next: "confession", affection: 6, mood: 7, energy: -1, coins: 0 },
          { text: "Ask her about her dreams for the future.", next: "shrine", affection: 5, mood: 6, energy: -1, coins: 0 }
        ]
      },

      forest: {
        label: "Tales of Magic",
        text: "Akira's golden eyes glow as she speaks. 'I've lived here for many years, protecting this forest and its secrets. But sometimes I wonder what it would be like to share my life with someone special. Someone like...' She trails off, looking at you meaningfully.",
        choices: [
          { text: "Tell her you want to be that person.", next: "confession", affection: 7, mood: 8, energy: -2, coins: 0 },
          { text: "Ask what kind of person she seeks.", next: "magic", affection: 5, mood: 6, energy: -1, coins: 0 },
          { text: "Suggest exploring more of the forest together.", next: "shrine", affection: 4, mood: 5, energy: -2, coins: 0 }
        ]
      },

      flattery: {
        label: "Breaking Through Barriers",
        text: "Akira seems touched by your sincerity. Her initial wariness fades, replaced by genuine warmth. 'You see me... not as a creature to fear, but as someone worthy of love. That means more than you know.' Her tail gently touches your hand.",
        choices: [
          { text: "Take her hand firmly and smile.", next: "confession", affection: 8, mood: 8, energy: -1, coins: 0 },
          { text: "Tell her you see her soul, not just appearance.", next: "confession", affection: 7, mood: 9, energy: -2, coins: 0 },
          { text: "Ask about her true feelings for you.", next: "magic", affection: 6, mood: 7, energy: -1, coins: 0 }
        ]
      },

      magic: {
        label: "Magical Revelation",
        text: "Akira's form shimmers with ethereal light. 'I could show you magic, real magic. But there's something I need to tell you first... When a kitsune falls in love, it's forever. We bond completely.' She looks at you nervously. 'Are you ready for that kind of love?'",
        choices: [
          { text: "Say yes without hesitation.", next: "confession", affection: 8, mood: 9, energy: -1, coins: 0 },
          { text: "Admit your feelings honestly.", next: "confession", affection: 7, mood: 8, energy: -1, coins: 0 },
          { text: "Ask her to show you this magic.", next: "confession", affection: 6, mood: 7, energy: -1, coins: 0 }
        ]
      },

      shrine: {
        label: "Ancient Shrine",
        text: "Akira brings you to an ancient shrine hidden in the forest. Inside, it glows with soft spiritual energy. 'This is sacred to my kind,' she says, kneeling before an altar. 'I want to make a wish here... a wish for you to stay with me forever.'",
        choices: [
          { text: "Kneel beside her and make the same wish.", next: "confession", affection: 9, mood: 9, energy: -2, coins: 0 },
          { text: "Tell her your heart already belongs to her.", next: "confession", affection: 8, mood: 8, energy: -1, coins: 0 },
          { text: "Ask what would make her happiest.", next: "confession", affection: 7, mood: 8, energy: -1, coins: 0 }
        ]
      },

      confession: {
        label: "Moment of Truth",
        text: "",
        choices: []
      }
    };

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function applyStats(choice) {
      state.affection = clamp(state.affection + (choice.affection || 0), 0, 100);
      state.mood = clamp(state.mood + (choice.mood || 0), 0, 100);
      state.energy = clamp(state.energy + (choice.energy || 0), 0, 100);
      state.coins = clamp(state.coins + (choice.coins || 0), 0, 999);
    }

    function renderStats() {
      document.getElementById("loveValue").textContent = state.affection;
      document.getElementById("energyValue").textContent = state.energy;
      document.getElementById("moodValue").textContent = state.mood;
      document.getElementById("coinsValue").textContent = state.coins;
      document.getElementById("dayValue").textContent = state.day;

      const moodBar = document.getElementById("moodBar");
      moodBar.style.width = state.mood + "%";
    }

    function loadScene(sceneKey) {
      const scene = scenes[sceneKey];
      if (!scene) {
        console.error("Scene not found:", sceneKey);
        return;
      }

      state.currentScene = sceneKey;

      const dialogueEl = document.getElementById("dialogue");
      const choicesEl = document.getElementById("choices");
      const sceneLabelEl = document.getElementById("sceneLabel");

      sceneLabelEl.textContent = scene.label;

      if (sceneKey === "confession") {
        let finalText, ending, endingText;

        if (state.affection >= 75) {
          finalText = "Akira steps close to you, her eyes shimmering with tears of joy. 'I love you,' she whispers. 'With all my heart, all my soul. Will you stay with me forever?' She takes both your hands, and you feel the warmth of pure, eternal love flow between you.";
          ending = "✨ TRUE LOVE ENDING ✨";
          endingText = `${state.playerName} and Akira are bound together by magic and love. They build a life between the human world and the forest, their love transcending all boundaries.`;
        } else if (state.affection >= 50) {
          finalText = "Akira smiles softly, her cheeks flushed. 'I care for you deeply,' she says. 'Maybe what we have can grow into something beautiful. Will you give us a chance?' You both know this is just the beginning.";
          ending = "🌸 BEAUTIFUL BEGINNING ENDING 🌸";
          endingText = `${state.playerName} and Akira start a journey together, uncertain but hopeful. Love blooms slowly like cherry blossoms in spring.`;
        } else {
          finalText = "Akira nods warmly. 'Thank you for seeing me as I truly am. That's a rare gift.' She smiles gently. 'Perhaps we can be friends, and maybe... something more will come with time.'";
          ending = "💫 SPARK OF HOPE ENDING 💫";
          endingText = `${state.playerName} and Akira part as friends, but with an unspoken promise that fate may bring them together again.`;
        }

        dialogueEl.textContent = finalText;
        document.getElementById("endingTitle").textContent = ending;
        document.getElementById("endingText").textContent = endingText;

        state.ending = ending;
        document.getElementById("gameScreen").classList.remove("active");
        document.getElementById("endingScreen").classList.add("active");
        saveGame();
        return;
      }

      dialogueEl.textContent = scene.text;
      choicesEl.innerHTML = "";

      scene.choices.forEach((choice) => {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.textContent = choice.text;
        btn.addEventListener("click", () => {
          applyStats(choice);
          renderStats();
          loadScene(choice.next);
        });
        choicesEl.appendChild(btn);
      });
    }

    function startGame() {
      const nameInput = document.getElementById("playerName");
      state.playerName = nameInput.value.trim() || "Player";
      state.girlfriendName = "Akira";
      state.affection = 0;
      state.mood = 50;
      state.energy = 60;
      state.coins = 10;
      state.day = 1;
      state.ending = null;
      state.history = [];

      document.getElementById("titleScreen").classList.remove("active");
      document.getElementById("gameScreen").classList.add("active");
      document.getElementById("endingScreen").classList.remove("active");

      renderStats();
      loadScene("intro");
    }

    function saveGame() {
      const saveData = { ...state };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(saveData));
      alert("💾 Game saved!");
    }

    function loadGame() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        alert("❌ No saved game found.");
        return;
      }

      try {
        const saveData = JSON.parse(raw);
        Object.assign(state, saveData);

        document.getElementById("titleScreen").classList.remove("active");
        document.getElementById("gameScreen").classList.add("active");
        document.getElementById("endingScreen").classList.remove("active");

        renderStats();
        if (state.ending) {
          document.getElementById("gameScreen").classList.remove("active");
          document.getElementById("endingScreen").classList.add("active");
          document.getElementById("endingTitle").textContent = state.ending;
          document.getElementById("endingText").textContent = `Welcome back! Your story with Akira continues...`;
        } else {
          loadScene(state.currentScene || "intro");
        }
      } catch (err) {
        alert("❌ Save data could not be loaded.");
        console.error(err);
      }
    }

    function resetGame() {
      localStorage.removeItem(STORAGE_KEY);
      document.getElementById("endingScreen").classList.remove("active");
      document.getElementById("gameScreen").classList.remove("active");
      document.getElementById("titleScreen").classList.add("active");
      document.getElementById("playerName").value = "Player";
      Object.assign(state, {
        playerName: "Player",
        girlfriendName: "Akira",
        affection: 0,
        mood: 50,
        energy: 60,
        coins: 10,
        day: 1,
        currentScene: "intro",
        ending: null,
        history: []
      });
      renderStats();
    }

    // Event Listeners
    document.getElementById("startBtn").addEventListener("click", startGame);
    document.getElementById("saveBtn").addEventListener("click", saveGame);
    document.getElementById("loadBtn").addEventListener("click", loadGame);
    document.getElementById("resetBtn").addEventListener("click", resetGame);
    document.getElementById("playAgainBtn").addEventListener("click", resetGame);

    document.getElementById("playerName").addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        startGame();
      }
    });

    renderStats();
  </script>
</body>
</html>
